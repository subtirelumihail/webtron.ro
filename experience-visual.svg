<svg xmlns="http://www.w3.org/2000/svg" width="440" height="520" viewBox="0 0 440 520" fill="none" aria-hidden="true">
  <defs>
    <filter id="ev-float" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#1e3a8a" flood-opacity="0.11"/>
    </filter>
    <filter id="ev-term-lift" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#020617" flood-opacity="0.4"/>
    </filter>
    <linearGradient id="ev-surface" x1="52" y1="110" x2="388" y2="440" gradientUnits="userSpaceOnUse">
      <stop stop-color="#eff6ff"/>
      <stop offset="0.5" stop-color="#eef2ff"/>
      <stop offset="1" stop-color="#e8efff"/>
    </linearGradient>
    <linearGradient id="ev-titlebar" x1="52" y1="58" x2="388" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1e293b"/>
      <stop offset="1" stop-color="#0c1222"/>
    </linearGradient>
    <linearGradient id="ev-terminal" x1="64" y1="308" x2="376" y2="432" gradientUnits="userSpaceOnUse">
      <stop stop-color="#121a2e"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
  </defs>

  <!-- Outer card -->
  <rect x="22" y="20" width="396" height="480" rx="24" fill="#fafbfc" stroke="#e5e7eb" stroke-width="1" filter="url(#ev-float)"/>

  <!-- Editor shell: one rounded panel -->
  <path fill="url(#ev-surface)" stroke="#c7d2fe" stroke-width="1"
    d="M 68 56
       H 372
       A 16 16 0 0 1 388 72
       V 448
       A 16 16 0 0 1 372 464
       H 68
       A 16 16 0 0 1 52 448
       V 72
       A 16 16 0 0 1 68 56
       Z"/>

  <!-- Title bar -->
  <path fill="url(#ev-titlebar)" d="M 68 56 H 372 A 16 16 0 0 1 388 72 V 100 H 52 V 72 A 16 16 0 0 1 68 56 Z"/>
  <circle cx="72" cy="78" r="5.5" fill="#f87171"/>
  <circle cx="92" cy="78" r="5.5" fill="#facc15"/>
  <circle cx="112" cy="78" r="5.5" fill="#34d399"/>
  <text x="376" y="83" text-anchor="end" fill="#94a3b8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="0.08em">editor</text>

  <!-- Gutter -->
  <rect x="52" y="100" width="34" height="198" fill="#93c5fd" fill-opacity="0.2"/>
  <line x1="86" y1="100" x2="86" y2="298" stroke="#bfdbfe" stroke-width="1"/>
  <!-- Editorial brace -->
  <text x="318" y="268" text-anchor="middle" font-family="Georgia, 'Times New Roman', Times, serif" font-size="198" font-weight="300"
    fill="none" stroke="#3b82f6" stroke-width="0.65" opacity="0.14">}</text>

  <!-- Line numbers -->
  <g fill="#64748b" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="500" opacity="0.8">
    <text x="80" y="138" text-anchor="end">1</text>
    <text x="80" y="166" text-anchor="end">2</text>
    <text x="80" y="194" text-anchor="end">3</text>
    <text x="80" y="222" text-anchor="end">4</text>
    <text x="80" y="250" text-anchor="end">5</text>
    <text x="80" y="278" text-anchor="end">6</text>
    <text x="80" y="306" text-anchor="end">7</text>
    <text x="80" y="334" text-anchor="end">8</text>
    <text x="80" y="362" text-anchor="end">9</text>
  </g>

  <!-- Code -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="600" letter-spacing="-0.02em">
    <text x="96" y="138" fill="#0f172a">
      <tspan fill="#7c3aed">async</tspan><tspan> </tspan><tspan fill="#2563eb">function</tspan><tspan> </tspan><tspan fill="#ea580c">ship</tspan><tspan fill="#475569">() {</tspan>
    </text>
    <text x="96" y="166" fill="#0f172a">
      <tspan fill="#047857">  const</tspan><tspan> ready = </tspan><tspan fill="#dc2626">true</tspan><tspan fill="#475569">;</tspan>
    </text>
    <text x="96" y="194" fill="#0f172a">
      <tspan fill="#b45309">  await</tspan><tspan> </tspan><tspan fill="#1d4ed8">deploy</tspan><tspan fill="#475569">(</tspan><tspan fill="#15803d">'prod'</tspan><tspan fill="#475569">);</tspan>
    </text>
    <text x="96" y="222" fill="#64748b" font-weight="500" font-size="12.5">  /* monitor · iterate */</text>
    <text x="96" y="250" fill="#0f172a">
      <tspan fill="#1d4ed8">  return</tspan><tspan> </tspan><tspan fill="#7c3aed">await</tspan><tspan> </tspan><tspan fill="#2563eb">healthCheck</tspan><tspan fill="#475569">();</tspan>
    </text>
    <text x="96" y="278" fill="#475569">}</text>
  </g>

  <!-- Terminal -->
  <g filter="url(#ev-term-lift)">
    <rect x="58" y="302" width="324" height="136" rx="14" fill="url(#ev-terminal)" stroke="rgba(148,163,184,0.22)" stroke-width="1"/>
    <rect x="58" y="302" width="324" height="28" rx="14" fill="#fff" fill-opacity="0.03"/>
    <line x1="58" y1="330" x2="382" y2="330" stroke="rgba(255,255,255,0.06)"/>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">
      <text x="74" y="354" font-size="12.5" font-weight="600">
        <tspan fill="#4ade80">$</tspan><tspan fill="#f8fafc"> npm run build</tspan>
      </text>
      <text x="74" y="378" fill="#94a3b8" font-size="11" font-weight="500">… compiled in 2.4s</text>
      <text x="74" y="402" font-size="11">
        <tspan fill="#4ade80" font-weight="700">✓</tspan><tspan fill="#67e8f9" font-weight="600"> production bundle ready</tspan>
      </text>
      <text x="74" y="426" font-size="12" font-weight="600">
        <tspan fill="#4ade80">$</tspan><tspan fill="#cbd5e1"> _</tspan>
      </text>
    </g>
  </g>
</svg>
